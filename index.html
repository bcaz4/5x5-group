<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5x5 Group</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #fafafa;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 32px 24px;
    border-bottom: 1px solid #e5e5e5;
  }

  .logo-placeholder {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .hero {
    max-width: 640px;
    text-align: center;
  }

  .hero h1 {
    font-size: clamp(2rem, 5vw, 3.25rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 20px;
  }

  .hero p {
    font-size: 1.1rem;
    color: #555;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .cta {
    display: inline-block;
    padding: 14px 28px;
    background: #1a1a1a;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    border-radius: 6px;
    font-size: 0.95rem;
  }

  .cta:hover {
    background: #333;
  }

  footer {
    padding: 24px;
    text-align: center;
    font-size: 0.85rem;
    color: #999;
    border-top: 1px solid #e5e5e5;
  }
</style>
</head>
<body>

  <header>
    <div class="logo-placeholder">5x5 Group</div>
  </header>

  <main>
    <div class="hero">
      <h1>Welcome to 5x5 Group</h1>
      <p>
        This is a placeholder landing page — final branding, colors, and copy
        coming soon. It's here so the site structure and prospect pages
        have a home to link back to.
      </p>
      <a href="#" class="cta">Learn More</a>
    </div>
  </main>

  <footer>
    &copy; 2026 5x5 Group. Placeholder page — content in progress.
  </footer>

</body>
</html>
